<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPS Proxy Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #161926;
            --bg-card: #1c2033;
            --bg-card-hover: #242942;
            --bg-elevated: #252a40;
            --text-primary: #e8eaf2;
            --text-secondary: #9499b3;
            --text-muted: #666b85;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.16);
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.14);
            --warning: #f59e0b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.14);
            --upload: #f472b6;
            --download: #38bdf8;
            --border: #2a2f47;
            --radius: 12px;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
        }

        [data-theme="light"] {
            --bg-primary: #f3f5f9;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f8f9fc;
            --bg-elevated: #eef1f7;
            --text-primary: #181c2e;
            --text-secondary: #5b6278;
            --text-muted: #8a92a8;
            --accent: #4f46e5;
            --accent-light: #6366f1;
            --accent-glow: rgba(79, 70, 229, 0.1);
            --border: #e3e7f0;
            --shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--download));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.4px;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            gap: 4px;
        }

        .nav-tab {
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: none;
            background: none;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: var(--accent-glow);
        }

        .nav-tab.active {
            color: var(--accent-light);
            background: var(--accent-glow);
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .refresh-indicator {
            font-size: 11px;
            color: var(--text-muted);
        }

        .retention-pill {
            font-size: 11px;
            color: var(--text-secondary);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .retention-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .icon-btn {
            height: 34px;
            min-width: 34px;
            padding: 0 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-secondary);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            color: var(--accent-light);
            border-color: var(--accent);
        }

        /* Main Container */
        .container {
            max-width: 1320px;
            margin: 0 auto;
            padding: 20px 24px 48px;
        }

        /* Global Report Control Bar */
        .filter-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .segmented {
            display: inline-flex;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 3px;
            gap: 2px;
        }

        .seg-btn {
            padding: 6px 14px;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            white-space: nowrap;
        }

        .seg-btn:hover {
            color: var(--text-primary);
        }

        .seg-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
        }

        .date-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 3px 6px;
        }

        .nav-arrow {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .nav-arrow:hover:not(:disabled) {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .window-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            padding: 0 6px;
            white-space: nowrap;
        }

        .window-sub {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: 4px;
        }

        .date-input {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(0.75);
            cursor: pointer;
        }

        [data-theme="light"] .date-input::-webkit-calendar-picker-indicator {
            filter: none;
        }

        .today-btn {
            padding: 5px 10px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .today-btn:hover {
            border-color: var(--accent);
            color: var(--accent-light);
        }

        .today-btn.hidden {
            display: none;
        }

        .user-select {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .user-select:focus {
            border-color: var(--accent);
        }

        .active-filter-chip {
            display: none;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            background: var(--accent-glow);
            border: 1px solid rgba(99, 102, 241, 0.35);
            color: var(--accent-light);
            font-size: 12px;
            font-weight: 500;
        }

        .active-filter-chip.visible {
            display: inline-flex;
        }

        .active-filter-chip button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        @media (max-width: 1120px) {
            .kpi-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 640px) {
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .retention-pill,
            .refresh-indicator {
                display: none;
            }
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 18px;
            transition: all 0.22s;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .kpi-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .kpi-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .kpi-delta {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 999px;
        }

        .kpi-delta.up {
            background: var(--success-bg);
            color: var(--success);
        }

        .kpi-delta.down {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .kpi-delta.neutral {
            background: var(--bg-elevated);
            color: var(--text-muted);
        }

        .kpi-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.6px;
        }

        .kpi-value.upload {
            color: var(--upload);
        }

        .kpi-value.download {
            color: var(--download);
        }

        .kpi-value.total {
            color: var(--accent-light);
        }

        .kpi-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Chart Section */
        .chart-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .section-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
        }

        .section-hint {
            font-size: 12px;
            color: var(--text-muted);
        }

        .chart-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .sub-selector {
            display: inline-flex;
            gap: 2px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 2px;
        }

        .sub-btn {
            padding: 4px 10px;
            border-radius: 5px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
        }

        .sub-btn:hover {
            color: var(--text-primary);
        }

        .sub-btn.active {
            background: var(--bg-elevated);
            color: var(--accent-light);
            font-weight: 600;
        }

        .chart-container {
            position: relative;
            height: 290px;
        }

        /* Two-column ranking */
        .ranking-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .ranking-grid {
                grid-template-columns: 1fr;
            }
        }

        .ranking-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .search-input {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 7px;
            padding: 5px 10px;
            font-size: 12px;
            width: 170px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            border-radius: 8px;
            transition: background 0.15s;
        }

        .ranking-item.clickable {
            cursor: pointer;
        }

        .ranking-item.clickable:hover {
            background: var(--bg-card-hover);
        }

        .ranking-item.selected-row {
            background: var(--accent-glow);
        }

        .ranking-item:last-child {
            border-bottom: none;
        }

        .ranking-rank {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--accent-glow);
            color: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .ranking-rank.top3 {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            color: #fff;
        }

        .ranking-info {
            flex: 1;
            min-width: 0;
        }

        .ranking-name {
            font-size: 13px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ranking-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .ranking-meta .up-txt {
            color: var(--upload);
        }

        .ranking-meta .down-txt {
            color: var(--download);
        }

        .ranking-right {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .ranking-value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            min-width: 72px;
            text-align: right;
        }

        .ranking-bar-bg {
            width: 74px;
            height: 6px;
            background: var(--bg-primary);
            border-radius: 3px;
            overflow: hidden;
        }

        .ranking-bar {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--download));
            transition: width 0.35s ease;
        }

        .status-badge {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
        }

        .status-active {
            background: var(--success-bg);
            color: var(--success);
        }

        .status-disabled {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* Regions Page */
        .regions-top-grid {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .regions-top-grid {
                grid-template-columns: 1fr;
            }
        }

        .region-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        .regions-top-grid .region-card {
            margin-bottom: 0;
        }

        .donut-container {
            position: relative;
            height: 240px;
        }

        #map-container {
            height: 360px;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .leaflet-container {
            background: var(--bg-primary) !important;
        }

        .country-item {
            display: flex;
            align-items: center;
            padding: 11px 4px;
            border-bottom: 1px solid var(--border);
        }

        .country-item:last-child {
            border-bottom: none;
        }

        .country-flag {
            font-size: 20px;
            margin-right: 12px;
        }

        .country-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        .country-code {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: 6px;
        }

        .country-traffic {
            font-size: 13px;
            font-weight: 600;
            margin-left: 12px;
            min-width: 78px;
            text-align: right;
        }

        .country-bar-bg {
            width: 110px;
            height: 7px;
            background: var(--bg-primary);
            border-radius: 4px;
            margin-left: 14px;
            overflow: hidden;
        }

        .country-bar {
            height: 100%;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--success), #34d399);
            transition: width 0.35s ease;
        }

        .country-pct {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: 10px;
            width: 44px;
            text-align: right;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <span class="logo">⚡ HTTPS Proxy</span>
            <div class="nav-tabs">
                <button class="nav-tab active" data-page="overview" onclick="switchPage('overview', this)">总览报表</button>
                <button class="nav-tab" data-page="regions" onclick="switchPage('regions', this)">地区分布</button>
            </div>
        </div>
        <div class="header-right">
            <span class="refresh-indicator" id="lastUpdate"></span>
            <span class="retention-pill" id="retentionPill" title="后台自动清理超期统计数据">
                <span class="retention-dot"></span>
                <span id="retentionText">保留最近 90 天</span>
            </span>
            <button class="icon-btn" onclick="refreshAll()" title="立即刷新">↻</button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="切换亮/暗主题">🌙</button>
        </div>
    </div>

    <div class="container">
        <!-- Global Time & User Filter Bar -->
        <div class="filter-bar">
            <div class="filter-group">
                <div class="segmented" id="periodSegmented">
                    <button class="seg-btn active" data-period="day" onclick="setPeriod('day')">按天</button>
                    <button class="seg-btn" data-period="week" onclick="setPeriod('week')">近 7 天</button>
                    <button class="seg-btn" data-period="month" onclick="setPeriod('month')">近 30 天</button>
                    <button class="seg-btn" data-period="quarter" onclick="setPeriod('quarter')">近 90 天</button>
                </div>

                <div class="date-nav">
                    <button class="nav-arrow" id="btnPrev" onclick="shiftWindow(-1)" title="上一周期">◀</button>
                    <span class="window-label" id="windowLabel">–</span>
                    <button class="nav-arrow" id="btnNext" onclick="shiftWindow(1)" title="下一周期">▶</button>
                </div>

                <input type="date" id="anchorDateInput" class="date-input" onchange="onDateInputChange(this.value)"
                    title="选择截止日期">

                <button class="today-btn hidden" id="btnBackToday" onclick="jumpToLatest()">回到最新</button>
            </div>

            <div class="filter-group">
                <span class="active-filter-chip" id="userChip">
                    <span>用户: <strong id="userChipName"></strong></span>
                    <button onclick="setSelectedUser('')" title="清除筛选">✕</button>
                </span>
                <select class="user-select" id="userFilter" onchange="setSelectedUser(this.value)">
                    <option value="">全部用户</option>
                </select>
            </div>
        </div>

        <!-- Overview Page -->
        <div class="page active" id="page-overview">
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-top">
                        <span class="kpi-label">总流量</span>
                        <span class="kpi-delta neutral" id="delta-total">–</span>
                    </div>
                    <div class="kpi-value total" id="kpi-total">–</div>
                    <div class="kpi-sub" id="sub-total">–</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-top">
                        <span class="kpi-label">下载流量</span>
                        <span class="kpi-delta neutral" id="delta-download">–</span>
                    </div>
                    <div class="kpi-value download" id="kpi-download">–</div>
                    <div class="kpi-sub" id="sub-download">–</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-top">
                        <span class="kpi-label">上传流量</span>
                        <span class="kpi-delta neutral" id="delta-upload">–</span>
                    </div>
                    <div class="kpi-value upload" id="kpi-upload">–</div>
                    <div class="kpi-sub" id="sub-upload">–</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-top">
                        <span class="kpi-label">连接数</span>
                        <span class="kpi-delta neutral" id="delta-conns">–</span>
                    </div>
                    <div class="kpi-value" id="kpi-conns">–</div>

                    <div class="kpi-value" id="kpi-countries">–</div>

            <div class="chart-section">
                <div class="section-header">

                        <div class="sub-selector">
                            <button class="sub-btn active" id="chartTypeLine" onclick="setChartType('line')">折线</button>
                            <button class="sub-btn" id="chartTypeBar" onclick="setChartType('bar')">柱状</button>
                        </div>

                    <canvas id="trendChart"></canvas>
                </div>

            <div class="ranking-grid">
                <div class="ranking-card">
                    <div class="section-header">
                        <div class="section-title-wrap">
                            <span class="section-title">Top 域名</span>
                            <span class="section-hint" id="domainPeriodTag"></span>
                        </div>
                        <input type="text" class="search-input" id="domainSearch" placeholder="搜索域名..."
                            oninput="onDomainSearchInput()">
                    </div>
                    <div id="domain-ranking"></div>
                </div>

                <div class="ranking-card">
                    <div class="section-header">
                        <div class="section-title-wrap">
                            <span class="section-title">用户流量排行</span>
                            <span class="section-hint">点击可筛选单人</span>

        <!-- Regions Page -->
        <div class="page" id="page-regions">
            <div class="regions-top-grid">
                <div class="region-card">
                    <div class="section-header">
                        <span class="section-title">大洲流量占比</span>
                        <span class="section-hint" id="continentPeriodTag"></span>
                    </div>
                    <div class="donut-container">
                        <canvas id="continentChart"></canvas>
                    </div>
                </div>
                <div class="region-card">
                    <div class="section-header">
                        <span class="section-title">国家/地区 Top 对比</span>
                        <span class="section-hint">上传 + 下载总流量</span>
                    </div>
                    <div class="donut-container">
                        <canvas id="countryBarChart"></canvas>
                    </div>
                </div>
            </div>

            <div id="map-container"></div>

            <div class="region-card">
                <div class="section-header">
                    <div class="section-title-wrap">
                        <span class="section-title">国家 / 地区流量明细</span>
                        <span class="section-hint" id="countryPeriodTag"></span>
                    </div>
                </div>
                <div id="country-list"></div>
            </div>
        </div>
    </div>

    <script>
        // ── Date Helpers ──
        function fmtDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return y + '-' + m + '-' + day;
        }

        function parseDate(str) {
            const parts = str.split('-').map(Number);
            return new Date(parts[0], parts[1] - 1, parts[2]);
        }

        function addDays(dateStr, delta) {
            const d = parseDate(dateStr);
            d.setDate(d.getDate() + delta);
            return fmtDate(d);
        }

        function diffDays(aStr, bStr) {
            return Math.round((parseDate(bStr) - parseDate(aStr)) / 86400000);
        }

        function escapeHTML(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatBytes(bytes) {
            if (!bytes || bytes <= 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.min(sizes.length - 1, Math.floor(Math.log(bytes) / Math.log(k)));
            const val = bytes / Math.pow(k, i);
            return (val >= 100 ? val.toFixed(0) : val >= 10 ? val.toFixed(1) : val.toFixed(2)) + ' ' + sizes[i];
        }

        function formatNumber(n) {
            return (n || 0).toLocaleString();
        }

        function countryCodeToEmoji(code) {
            if (!code || code.length !== 2) return '🌐';
            return String.fromCodePoint(...[...code.toUpperCase()].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
        }

        const CONTINENT_ZH = {
            AS: '亚洲',
            NA: '北美洲',
            EU: '欧洲',
            SA: '南美洲',
            OC: '大洋洲',
            AF: '非洲',
            AN: '南极洲',
        };

        // ── State ──
        let retentionDays = 90;
        let todayStr = fmtDate(new Date());
        let minDateStr = addDays(todayStr, -(retentionDays - 1));

        const state = {
            page: 'overview',
            period: 'day',          // 'day' | 'week' | 'month' | 'quarter'
            anchorDate: todayStr,
            selectedUser: '',
            chartType: 'line',      // 'line' | 'bar'
            granularity: 'hour',    // 'hour' | '1h' | '30m' | 'day' | 'week'
        };

        let trendChart = null;
        let continentChart = null;
        let countryBarChart = null;
        let leafletMap = null;
        let geoLayer = null;
        let latestCountryData = [];
        let domainSearchTimer = null;

        // ── Theme ──
        function toggleTheme() {
            const html = document.documentElement;
            const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
            localStorage.setItem('theme', next);
            loadTrends();
            if (state.page === 'regions') renderRegionCharts(latestCountryData);
        }

        function initTheme() {
            const saved = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            document.getElementById('themeBtn').textContent = saved === 'dark' ? '🌙' : '☀️';
        }

        // ── Window Calculations ──
        function getPeriodSpan(period) {
            switch (period) {
                case 'day': return 1;
                case 'week': return 7;
                case 'month': return 30;
                case 'quarter': return retentionDays;
                default: return 1;
            }
        }

        function getCurrentWindow() {
            const span = getPeriodSpan(state.period);
            let end = state.anchorDate;
            if (end > todayStr) end = todayStr;
            if (end < minDateStr) end = minDateStr;

            let start = addDays(end, -(span - 1));
            if (start < minDateStr) {
                start = minDateStr;
                end = addDays(start, span - 1);
                if (end > todayStr) end = todayStr;
            }
            return { start, end, span: diffDays(start, end) + 1 };
        }

        function buildQuery(params) {
            const sp = new URLSearchParams();
            for (const [k, v] of Object.entries(params)) {
                if (v !== undefined && v !== null && v !== '') {
                    sp.set(k, String(v));
                }
            }
            return sp.toString();
        }

        // ── API ──
        async function fetchJSON(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                return data.success ? data.data : null;
            } catch (e) {
                console.error('Fetch error:', url, e);
                return null;
            }
        }

        async function loadMeta() {
            const meta = await fetchJSON('/api/v2/meta');
            if (!meta) return;
            const prevToday = todayStr;
            if (meta.retention_days > 0) retentionDays = meta.retention_days;
            if (meta.today) todayStr = meta.today;
            if (meta.min_date) minDateStr = meta.min_date;
            if (state.anchorDate === prevToday || state.anchorDate > todayStr) {
                state.anchorDate = todayStr;
            }
            document.getElementById('retentionText').textContent = '保留最近 ' + retentionDays + ' 天';
            const qBtn = document.querySelector('#periodSegmented .seg-btn[data-period="quarter"]');
            if (qBtn) qBtn.textContent = '近 ' + retentionDays + ' 天';
        }

        async function loadUserDropdown() {
            const users = await fetchJSON('/api/v2/users');
            if (!users) return;
            const sel = document.getElementById('userFilter');
            const prevVal = state.selectedUser;
            sel.innerHTML = '<option value="">全部用户</option>' + users.map(u => {
                const suffix = u.disabled ? ' (已禁用)' : '';
                return '<option value="' + escapeHTML(u.username) + '">' + escapeHTML(u.username) + suffix + '</option>';
            }).join('');
            sel.value = prevVal;
        }

        // ── Filter Bar ──
        function renderFilterBar() {
            const win = getCurrentWindow();
            const labelEl = document.getElementById('windowLabel');
            const dateInput = document.getElementById('anchorDateInput');
            const btnPrev = document.getElementById('btnPrev');
            const btnNext = document.getElementById('btnNext');
            const btnBackToday = document.getElementById('btnBackToday');

            dateInput.min = minDateStr;
            dateInput.max = todayStr;
            dateInput.value = win.end;

            if (state.period === 'day') {
                const tag = win.end === todayStr ? '今天' : (win.end === addDays(todayStr, -1) ? '昨天' : '');
                labelEl.innerHTML = win.end + (tag ? '<span class="window-sub">(' + tag + ')</span>' : '');
            } else if (state.period === 'week') {
                labelEl.innerHTML = win.start + ' ~ ' + win.end + '<span class="window-sub">(滚动 7 天)</span>';
            } else if (state.period === 'month') {
                labelEl.innerHTML = win.start + ' ~ ' + win.end + '<span class="window-sub">(滚动 30 天)</span>';
            } else {
                labelEl.innerHTML = win.start + ' ~ ' + win.end + '<span class="window-sub">(最近 ' + retentionDays + ' 天)</span>';
            }

            const isQuarter = state.period === 'quarter';
            btnPrev.disabled = isQuarter || win.start <= minDateStr;
            btnNext.disabled = isQuarter || win.end >= todayStr;
            dateInput.style.display = isQuarter ? 'none' : 'inline-block';
            btnBackToday.classList.toggle('hidden', isQuarter || win.end === todayStr);

            renderGranularityControls(win);
            return win;
        }

        function renderGranularityControls(win) {
            const wrap = document.getElementById('granularitySelector');
            const options = [];
            if (state.period === 'day') {
                options.push({ key: 'hour', label: '按小时 (24h)' });
                if (win.end === todayStr) {
                    options.push({ key: '1h', label: '实时 1h' });
                    options.push({ key: '30m', label: '实时 30m' });
                }
            } else if (state.period === 'week') {
                options.push({ key: 'day', label: '按天 (7天)' });
                options.push({ key: 'hour', label: '按小时' });
            } else if (state.period === 'month') {
                options.push({ key: 'day', label: '按天 (30天)' });
            } else {
                options.push({ key: 'day', label: '按天 (' + retentionDays + '天)' });
                options.push({ key: 'week', label: '按周汇总' });
            }

            if (!options.some(o => o.key === state.granularity)) {
                state.granularity = options[0].key;
            }

            wrap.innerHTML = options.map(o =>
                '<button class="sub-btn ' + (state.granularity === o.key ? 'active' : '') + '" onclick="setGranularity(\'' + o.key + '\')">' + o.label + '</button>'
            ).join('');
        }

        // ── Interactions ──
        function setPeriod(period) {
            state.period = period;
            if (period === 'quarter') {
                state.anchorDate = todayStr;
                state.granularity = 'day';
            } else if (period === 'day') {
                state.granularity = 'hour';
            } else {
                state.granularity = 'day';
            }
            document.querySelectorAll('#periodSegmented .seg-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.period === period);
            });
            refreshAll();
        }

        function shiftWindow(direction) {
            if (state.period === 'quarter') return;
            const step = getPeriodSpan(state.period);
            const nextAnchor = addDays(state.anchorDate, direction * step);
            if (nextAnchor > todayStr) {
                state.anchorDate = todayStr;
            } else {
                const minAnchor = addDays(minDateStr, step - 1);
                state.anchorDate = nextAnchor < minAnchor ? minAnchor : nextAnchor;
            }
            if (state.period === 'day' && state.anchorDate !== todayStr && (state.granularity === '30m' || state.granularity === '1h')) {
                state.granularity = 'hour';
            }
            refreshAll();
        }

        function onDateInputChange(val) {
            if (!val) return;
            if (val > todayStr) val = todayStr;
            if (val < minDateStr) val = minDateStr;
            state.anchorDate = val;
            if (state.period === 'day' && val !== todayStr && (state.granularity === '30m' || state.granularity === '1h')) {
                state.granularity = 'hour';
            }
            refreshAll();
        }

        function jumpToLatest() {
            state.anchorDate = todayStr;
            refreshAll();
        }

        function setSelectedUser(username) {
            state.selectedUser = username;
            document.getElementById('userFilter').value = username;
            const chip = document.getElementById('userChip');
            if (username) {
                document.getElementById('userChipName').textContent = username;
                chip.classList.add('visible');
            } else {
                chip.classList.remove('visible');
            }
            refreshAll();
        }

        function setGranularity(g) {
            state.granularity = g;
            renderGranularityControls(getCurrentWindow());
            loadTrends();
        }

        function setChartType(type) {
            state.chartType = type;
            document.getElementById('chartTypeLine').classList.toggle('active', type === 'line');
            document.getElementById('chartTypeBar').classList.toggle('active', type === 'bar');
            loadTrends();
        }

        function switchPage(page, btn) {
            state.page = page;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('page-' + page).classList.add('active');
            btn.classList.add('active');
            if (page === 'regions') {
                if (!leafletMap) initMap();
                setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 50);
                loadCountries();
            } else {
                loadTrends();
            }
        }

        function onDomainSearchInput() {
            clearTimeout(domainSearchTimer);
            domainSearchTimer = setTimeout(loadDomains, 200);
        }

        // ── Overview KPIs ──
        function setDelta(elId, curVal, prevVal, hasPrev) {
            const el = document.getElementById(elId);
            if (!hasPrev || prevVal === null || prevVal === undefined) {
                el.textContent = state.period === 'quarter' ? (retentionDays + '天汇总') : '无上期';
                el.className = 'kpi-delta neutral';
                return;
            }
            if (prevVal === 0) {
                el.textContent = curVal > 0 ? '+100%' : '0%';
                el.className = 'kpi-delta neutral';
                return;
            }
            const pct = ((curVal - prevVal) / prevVal) * 100;
            const sign = pct > 0 ? '+' : '';
            el.textContent = sign + pct.toFixed(1) + '%';
            el.className = 'kpi-delta ' + (pct > 1 ? 'up' : pct < -1 ? 'down' : 'neutral');
        }

        async function loadOverview() {
            const win = getCurrentWindow();
            const qs = buildQuery({
                start: win.start,
                end: win.end,
                user: state.selectedUser,
                compare: state.period === 'quarter' ? 0 : 1,
            });
            const data = await fetchJSON('/api/v2/overview?' + qs);
            if (!data) return;

            const total = (data.total_upload || 0) + (data.total_download || 0);
            const prev = data.previous || null;
            const prevTotal = prev ? ((prev.total_upload || 0) + (prev.total_download || 0)) : null;

            document.getElementById('kpi-total').textContent = formatBytes(total);
            document.getElementById('kpi-download').textContent = formatBytes(data.total_download);
            document.getElementById('kpi-upload').textContent = formatBytes(data.total_upload);
            document.getElementById('kpi-conns').textContent = formatNumber(data.total_connections);
            document.getElementById('kpi-domains').textContent = formatNumber(data.domain_count);
            document.getElementById('kpi-countries').textContent = formatNumber(data.country_count);

            const avgDaily = total / Math.max(1, win.span);
            document.getElementById('sub-total').textContent = win.span > 1 ? ('日均 ' + formatBytes(avgDaily)) : '当日总流量';
            const dlPct = total > 0 ? ((data.total_download || 0) / total * 100).toFixed(1) : '0';
            const ulPct = total > 0 ? ((data.total_upload || 0) / total * 100).toFixed(1) : '0';
            document.getElementById('sub-download').textContent = '占比 ' + dlPct + '%';
            document.getElementById('sub-upload').textContent = '占比 ' + ulPct + '%';
            document.getElementById('sub-conns').textContent = win.span > 1
                ? ('日均 ' + formatNumber(Math.round((data.total_connections || 0) / win.span)))
                : '当日隧道连接';

            setDelta('delta-total', total, prevTotal, !!prev);
            setDelta('delta-download', data.total_download || 0, prev ? prev.total_download : null, !!prev);
            setDelta('delta-upload', data.total_upload || 0, prev ? prev.total_upload : null, !!prev);
            setDelta('delta-conns', data.total_connections || 0, prev ? prev.total_connections : null, !!prev);
            setDelta('delta-domains', data.domain_count || 0, prev ? prev.domain_count : null, !!prev);
            setDelta('delta-countries', data.country_count || 0, prev ? prev.country_count : null, !!prev);

            document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
        }

        // ── Trends Chart ──
        function formatTrendLabel(rawTime) {
            if (!rawTime) return '';
            if (state.granularity === '30m' || state.granularity === '1h') {
                return rawTime.length >= 16 ? rawTime.substring(11, 16) : rawTime;
            }
            if (state.granularity === 'hour') {
                if (state.period === 'day') {
                    return rawTime.length >= 16 ? rawTime.substring(11, 16) : rawTime;
                }
                return rawTime.length >= 16 ? (rawTime.substring(5, 10) + ' ' + rawTime.substring(11, 16)) : rawTime;
            }
            if (state.granularity === 'day') {
                return rawTime.length >= 10 ? rawTime.substring(5, 10) : rawTime;
            }
            return rawTime;
        }

        async function loadTrends() {
            const win = getCurrentWindow();
            const qs = buildQuery({
                start: win.start,
                end: win.end,
                granularity: state.granularity,
                user: state.selectedUser,
            });
            const points = (await fetchJSON('/api/v2/trends?' + qs)) || [];

            const titleMap = {
                day: state.granularity === 'hour' ? (win.end + ' 流量趋势（按小时）') : ('实时流量趋势（最近 ' + state.granularity + '）'),
                week: '滚动 7 天流量趋势（' + win.start + ' ~ ' + win.end + '）',
                month: '滚动 30 天流量趋势（' + win.start + ' ~ ' + win.end + '）',
                quarter: '最近 ' + retentionDays + ' 天流量趋势（' + win.start + ' ~ ' + win.end + '）',
            };
            const drillable = state.period !== 'day';
            document.getElementById('trendTitle').textContent = titleMap[state.period];
            document.getElementById('trendHint').textContent = drillable ? '点击数据点可下钻查看当天' : '';

            const style = getComputedStyle(document.documentElement);
            const gridColor = style.getPropertyValue('--border').trim();
            const textColor = style.getPropertyValue('--text-muted').trim();

            const labels = points.map(p => formatTrendLabel(p.time));
            const uploads = points.map(p => p.upload || 0);
            const downloads = points.map(p => p.download || 0);

            const ctx = document.getElementById('trendChart').getContext('2d');
            if (trendChart) trendChart.destroy();

            const isBar = state.chartType === 'bar';
            trendChart = new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels,
                    datasets: [
                        {
                            label: '下载',
                            data: downloads,
                            borderColor: '#38bdf8',
                            backgroundColor: isBar ? 'rgba(56, 189, 248, 0.72)' : 'rgba(56, 189, 248, 0.14)',
                            fill: !isBar,
                            tension: 0.35,
                            pointRadius: points.length <= 31 ? 2.5 : 0,
                            pointHoverRadius: 5,
                            borderWidth: isBar ? 0 : 2,
                            borderRadius: isBar ? 4 : 0,
                            stack: isBar ? 'traffic' : undefined,
                        },
                        {
                            label: '上传',
                            data: uploads,
                            borderColor: '#f472b6',
                            backgroundColor: isBar ? 'rgba(244, 114, 182, 0.78)' : 'rgba(244, 114, 182, 0.14)',
                            fill: !isBar,
                            tension: 0.35,
                            pointRadius: points.length <= 31 ? 2.5 : 0,
                            pointHoverRadius: 5,
                            borderWidth: isBar ? 0 : 2,
                            borderRadius: isBar ? 4 : 0,
                            stack: isBar ? 'traffic' : undefined,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    onClick: (_, elements) => {
                        if (!drillable || !elements || !elements.length) return;
                        const pt = points[elements[0].index];
                        if (pt && pt.date) {
                            state.anchorDate = pt.date;
                            if (state.period === 'quarter' && state.granularity === 'week') {
                                setPeriod('week');
                            } else {
                                setPeriod('day');
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: true,
                            labels: { color: textColor, usePointStyle: true, pointStyle: 'circle', padding: 16, font: { size: 12 } }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(22, 25, 38, 0.95)',
                            titleColor: '#e8eaf2',
                            bodyColor: '#c3c7db',
                            borderColor: '#2a2f47',
                            borderWidth: 1,
                            padding: 12,
                            callbacks: {
                                label: c => c.dataset.label + ': ' + formatBytes(c.raw),
                                afterBody: items => {
                                    const sum = items.reduce((acc, it) => acc + (it.raw || 0), 0);
                                    return '合计: ' + formatBytes(sum);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            stacked: isBar,
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: textColor, maxTicksLimit: 12, font: { size: 11 } }
                        },
                        y: {
                            stacked: isBar,
                            beginAtZero: true,
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: textColor, font: { size: 11 }, callback: v => formatBytes(v) }
                        }
                    }
                }
            });
        }

        // ── Top Domains ──
        async function loadDomains() {
            const win = getCurrentWindow();
            document.getElementById('domainPeriodTag').textContent = win.span === 1 ? win.end : (win.start + ' ~ ' + win.end);
            const search = (document.getElementById('domainSearch').value || '').trim();
            const qs = buildQuery({
                start: win.start,
                end: win.end,
                limit: 10,
                user: state.selectedUser,
                q: search,
            });
            const data = await fetchJSON('/api/v2/domains?' + qs);
            const container = document.getElementById('domain-ranking');
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state">当前周期内无域名访问记录</div>';
                return;
            }
            const maxTraffic = (data[0].upload || 0) + (data[0].download || 0);
            container.innerHTML = data.map((d, i) => {
                const total = (d.upload || 0) + (d.download || 0);
                const pct = maxTraffic > 0 ? (total / maxTraffic * 100) : 0;
                return '<div class="ranking-item">' +
                    '<span class="ranking-rank ' + (i < 3 ? 'top3' : '') + '">' + (i + 1) + '</span>' +
                    '<div class="ranking-info">' +
                        '<div class="ranking-name">' + escapeHTML(d.domain) + '</div>' +
                        '<div class="ranking-meta">' +
                            '<span class="down-txt">↓ ' + formatBytes(d.download) + '</span> · ' +
                            '<span class="up-txt">↑ ' + formatBytes(d.upload) + '</span> · ' +
                            formatNumber(d.conn_count) + ' 连接' +
                        '</div>' +
                    '</div>' +
                    '<div class="ranking-right">' +
                        '<span class="ranking-value">' + formatBytes(total) + '</span>' +
                        '<div class="ranking-bar-bg"><div class="ranking-bar" style="width:' + pct + '%"></div></div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        // ── Users Ranking ──
        async function loadUsers() {
            const win = getCurrentWindow();
            const qs = buildQuery({ start: win.start, end: win.end });
            const data = await fetchJSON('/api/v2/users?' + qs);
            const container = document.getElementById('user-ranking');
            if (!data || data.length === 0) {
                container.innerHTML = '<div class="empty-state">当前周期内无用户流量记录</div>';
                return;
            }
            const maxTraffic = Math.max(...data.map(u => (u.total_upload || 0) + (u.total_download || 0)));
            container.innerHTML = data.map((u, i) => {
                const total = (u.total_upload || 0) + (u.total_download || 0);
                const pct = maxTraffic > 0 ? (total / maxTraffic * 100) : 0;
                const selected = state.selectedUser === u.username;
                const badge = u.disabled
                    ? '<span class="status-badge status-disabled">已禁用</span>'
                    : '<span class="status-badge status-active">正常</span>';
                const safeUser = escapeHTML(u.username);
                const clickArg = selected ? '' : u.username;
                return '<div class="ranking-item clickable ' + (selected ? 'selected-row' : '') + '" data-username="' + escapeHTML(clickArg) + '" onclick="setSelectedUser(this.dataset.username)">' +
                    '<span class="ranking-rank ' + (i < 3 ? 'top3' : '') + '">' + (i + 1) + '</span>' +
                    '<div class="ranking-info">' +
                        '<div class="ranking-name">' + safeUser + ' ' + badge + '</div>' +
                        '<div class="ranking-meta">' +
                            '<span class="down-txt">↓ ' + formatBytes(u.total_download) + '</span> · ' +
                            '<span class="up-txt">↑ ' + formatBytes(u.total_upload) + '</span> · ' +
                            formatNumber(u.conn_count) + ' 连接' +
                        '</div>' +
                    '</div>' +
                    '<div class="ranking-right">' +
                        '<span class="ranking-value">' + formatBytes(total) + '</span>' +
                        '<div class="ranking-bar-bg"><div class="ranking-bar" style="width:' + pct + '%"></div></div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        // ── Countries / Regions Page ──
        async function loadCountries() {
            const win = getCurrentWindow();
            const periodText = win.span === 1 ? win.end : (win.start + ' ~ ' + win.end);
            document.getElementById('continentPeriodTag').textContent = periodText;
            document.getElementById('countryPeriodTag').textContent = periodText;

            const qs = buildQuery({ start: win.start, end: win.end, user: state.selectedUser });
            const data = (await fetchJSON('/api/v2/countries?' + qs)) || [];
            latestCountryData = data;

            const container = document.getElementById('country-list');
            if (!data.length) {
                container.innerHTML = '<div class="empty-state">当前周期内无地区数据（请确认已启用 GeoIP 数据库）</div>';
                renderRegionCharts([]);
                if (leafletMap && geoLayer) updateMapColors([]);
                return;
            }

            const totalTraffic = data.reduce((s, c) => s + (c.upload || 0) + (c.download || 0), 0);
            const maxTraffic = (data[0].upload || 0) + (data[0].download || 0);

            container.innerHTML = data.map(c => {
                const total = (c.upload || 0) + (c.download || 0);
                const pct = totalTraffic > 0 ? (total / totalTraffic * 100).toFixed(1) : '0.0';
                const barPct = maxTraffic > 0 ? (total / maxTraffic * 100) : 0;
                const contLabel = CONTINENT_ZH[c.continent] || c.continent || '';
                const codeMeta = contLabel ? (c.country + ' · ' + contLabel) : c.country;
                return '<div class="country-item">' +
                    '<span class="country-flag">' + countryCodeToEmoji(c.country) + '</span>' +
                    '<span class="country-name">' + escapeHTML(c.country_name || c.country) + '<span class="country-code">' + escapeHTML(codeMeta) + '</span></span>' +
                    '<span class="country-traffic">' + formatBytes(total) + '</span>' +
                    '<div class="country-bar-bg"><div class="country-bar" style="width:' + barPct + '%"></div></div>' +
                    '<span class="country-pct">' + pct + '%</span>' +
                '</div>';
            }).join('');

            renderRegionCharts(data);
            if (leafletMap && geoLayer) updateMapColors(data);
        }

        function renderRegionCharts(countries) {
            const style = getComputedStyle(document.documentElement);
            const textColor = style.getPropertyValue('--text-secondary').trim();
            const gridColor = style.getPropertyValue('--border').trim();

            const contMap = {};
            let totalAll = 0;
            for (const c of countries) {
                const label = CONTINENT_ZH[c.continent] || c.continent || '其他';
                const t = (c.upload || 0) + (c.download || 0);
                contMap[label] = (contMap[label] || 0) + t;
                totalAll += t;
            }

            const cCtx = document.getElementById('continentChart').getContext('2d');
            if (continentChart) continentChart.destroy();
            continentChart = new Chart(cCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(contMap),
                    datasets: [{
                        data: Object.values(contMap),
                        backgroundColor: ['#6366f1', '#38bdf8', '#10b981', '#f472b6', '#f59e0b', '#a855f7'],
                        borderWidth: 0,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '64%',
                    plugins: {
                        legend: { position: 'right', labels: { color: textColor, padding: 14, usePointStyle: true } },
                        tooltip: {
                            callbacks: {
                                label: ctx => {
                                    const pct = totalAll > 0 ? (ctx.raw / totalAll * 100).toFixed(1) : '0';
                                    return ctx.label + ': ' + formatBytes(ctx.raw) + ' (' + pct + '%)';
                                }
                            }
                        }
                    }
                }
            });

            const topC = countries.slice(0, 6);
            const bCtx = document.getElementById('countryBarChart').getContext('2d');
            if (countryBarChart) countryBarChart.destroy();
            countryBarChart = new Chart(bCtx, {
                type: 'bar',
                data: {
                    labels: topC.map(c => countryCodeToEmoji(c.country) + ' ' + (c.country_name || c.country)),
                    datasets: [
                        { label: '下载', data: topC.map(c => c.download || 0), backgroundColor: 'rgba(56, 189, 248, 0.78)', borderRadius: 4, stack: 's' },
                        { label: '上传', data: topC.map(c => c.upload || 0), backgroundColor: 'rgba(244, 114, 182, 0.78)', borderRadius: 4, stack: 's' },
                    ]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor, usePointStyle: true } },
                        tooltip: { callbacks: { label: c => c.dataset.label + ': ' + formatBytes(c.raw) } }
                    },
                    scales: {
                        x: { stacked: true, grid: { color: gridColor }, ticks: { color: textColor, callback: v => formatBytes(v) } },
                        y: { stacked: true, grid: { display: false }, ticks: { color: textColor } }
                    }
                }
            });
        }

        // ── Leaflet World Map ──
        function initMap() {
            if (typeof L === 'undefined') return;
            leafletMap = L.map('map-container', {
                center: [20, 0], zoom: 2,
                minZoom: 2, maxZoom: 6,
                zoomControl: true,
                attributionControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 19
            }).addTo(leafletMap);

            fetch('https://cdn.jsdelivr.net/npm/@amcharts/amcharts5-geodata@5/worldLow.json')
                .then(r => r.json())
                .then(geojson => {
                    geoLayer = L.geoJSON(geojson, {
                        style: { fillColor: '#2a2e42', fillOpacity: 0.6, weight: 1, color: '#3a3e52' },
                        onEachFeature: (feature, layer) => {
                            layer.on('mouseover', function () { this.setStyle({ fillOpacity: 0.85 }); });
                            layer.on('mouseout', function () { this.setStyle({ fillOpacity: this._baseOpacity || 0.6 }); });
                        }
                    }).addTo(leafletMap);
                    updateMapColors(latestCountryData);
                })
                .catch(e => console.error('GeoJSON load failed:', e));
        }

        function updateMapColors(countryData) {
            if (!geoLayer) return;
            const trafficMap = {};
            let maxVal = 0;
            (countryData || []).forEach(c => {
                const total = (c.upload || 0) + (c.download || 0);
                trafficMap[c.country] = total;
                if (total > maxVal) maxVal = total;
            });

            geoLayer.eachLayer(layer => {
                const props = layer.feature.properties || {};
                const iso = props.ISO_A2 || props.iso_a2 || props.id || layer.feature.id || '';
                const traffic = trafficMap[iso] || 0;

                if (traffic > 0 && maxVal > 0) {
                    const intensity = Math.log(traffic + 1) / Math.log(maxVal + 1);
                    const r = Math.round(99 + (16 - 99) * intensity);
                    const g = Math.round(102 + (185 - 102) * intensity);
                    const b = Math.round(241 + (129 - 241) * intensity);
                    const op = 0.65 + intensity * 0.35;
                    layer._baseOpacity = op;
                    layer.setStyle({ fillColor: 'rgb(' + r + ',' + g + ',' + b + ')', fillOpacity: op });
                    layer.bindTooltip(iso + ': ' + formatBytes(traffic), { sticky: true });
                } else {
                    layer._baseOpacity = 0.6;
                    layer.setStyle({ fillColor: '#2a2e42', fillOpacity: 0.6 });
                    layer.unbindTooltip();
                }
            });
        }

        // ── Orchestration ──
        async function refreshAll() {
            renderFilterBar();
            const tasks = [loadOverview(), loadTrends(), loadDomains(), loadUsers()];
            if (state.page === 'regions') {
                tasks.push(loadCountries());
            }
            await Promise.all(tasks);
        }

        async function bootstrap() {
            initTheme();
            await loadMeta();
            await loadUserDropdown();
            await refreshAll();
            setInterval(async () => {
                await loadMeta();
                await refreshAll();
            }, 30000);
        }

        bootstrap();
    </script>
</body>
